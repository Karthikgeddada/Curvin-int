# Render deployment for the Curvin Intelligence FastAPI backend.
# Docs: https://render.com/docs/blueprint-spec
# After the first deploy, set GEMINI_API_KEY and OPENROUTER_API_KEY in the
# Render dashboard (Environment tab) - they are marked sync:false so they are
# NOT committed here.
services:
  - type: web
    name: curvin-intelligence
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-web.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.10"
      - key: SENTIMENT_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      # Deep read: how many top articles get their FULL text fetched and
      # scored (0 disables deep read). Adds a few seconds per fetch.
      - key: DEEP_READ_LIMIT
        value: "15"
      # Optional: lock CORS to your Vercel frontend URL (default allows all)
      # - key: ALLOWED_ORIGIN
      #   value: https://your-app.vercel.app
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # Supabase Postgres connection pooling URI (optional persistence):
      # Project Settings → Database → Connection string (port 6543)
      - key: DATABASE_URL
        sync: false
